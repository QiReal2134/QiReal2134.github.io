<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人主页</title>
  <link rel="icon" type="image/jpeg" href="avatar.jpg">
  <link rel="preconnect" href="https://api.github.com">
  <link rel="preconnect" href="https://raw.githubusercontent.com">
  <link rel="dns-prefetch" href="https://api.github.com">
  <link rel="dns-prefetch" href="https://raw.githubusercontent.com">
  <script src="config.js"></script>
  <script>
    document.documentElement.dataset.theme =
      localStorage.getItem("theme") || window.SITE_CONFIG.defaultTheme;
    document.title = window.SITE_CONFIG.title;
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-fx"></div>

  <!-- 灵动岛导航 -->
  <header class="island">
    <a class="logo" href="#" id="logoLink">
      <span class="logo-dot"></span>
      <span id="logoText"></span>
    </a>

    <nav class="nav-links" id="navLinks"></nav>

    <button class="theme-toggle" id="themeToggle" aria-label="切换深浅色" title="切换深浅色">
      <svg class="icon-sun" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </button>
  </header>

  <!-- 三屏横向滑动容器 -->
  <div class="pages-viewport" id="pagesViewport">
    <div class="pages-track" id="pagesTrack">

      <!-- 第一屏：首页 -->
      <section class="page" data-page="home">
        <main class="hero">
          <div class="avatar-wrap">
            <img class="avatar" id="avatar" src="avatar.jpg" alt="我的头像">
          </div>
          <div class="intro">
            <h1 class="name" id="name"></h1>
            <p class="tagline" id="tagline"></p>
            <p class="bio" id="bio"></p>
            <p class="status"><span class="status-dot"></span><span id="statusText"></span></p>
          </div>
        </main>
        <p class="swipe-hint">← 左右滑动查看更多 →</p>
      </section>

      <!-- 第二屏：作品 -->
      <section class="page" data-page="works">
        <main class="works">
          <h1 class="works-title">我的作品</h1>
          <p class="works-sub">自动同步 GitHub 公开仓库 · 点击卡片查看详情与下载</p>
          <div class="works-grid" id="worksGrid">
            <div class="works-loading">正在从 GitHub 加载仓库…</div>
          </div>
        </main>
      </section>

      <!-- 第三屏：关于 -->
      <section class="page" data-page="about">
        <main class="about">
          <h1 class="works-title" id="aboutTitle"></h1>
          <div id="aboutBody"></div>
          <div class="dl-buttons" id="aboutLinks"></div>
        </main>
      </section>

    </div>
  </div>

  <footer class="footer">
    <span id="footerText"></span>
  </footer>

  <script src="script.js"></script>
  <script src="snow.js"></script>
  <script src="works.js"></script>
</body>
</html>
